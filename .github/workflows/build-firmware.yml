name: Build Firmware

on:
  push:
    branches: [ main00, main, lbjradio ]
    paths:
      - 'App/**'
      - '!App/apps/**'
      - 'Core/**'
      - 'Drivers/**'
      - 'Middlewares/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'Dockerfile'
      - 'compile-with-docker.sh'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

concurrency:
  group: build-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ Fusion, LBJRadio ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile ${{ matrix.preset }}
      run: |
        chmod +x compile-with-docker.sh
        ./compile-with-docker.sh ${{ matrix.preset }}

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.preset }}
        path: build/${{ matrix.preset }}/*.bin
