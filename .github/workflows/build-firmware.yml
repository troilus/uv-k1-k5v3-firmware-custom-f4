name: Build Firmware

on:
  push:
    branches: [ main00, main ]
    paths:
      - 'App/**'
      - '!App/apps/**'
      - 'Core/**'
      - 'Drivers/**'
      - 'Middlewares/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'Dockerfile'
      - 'compile-with-docker.sh'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

concurrency:
  group: build-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One artifact: the "9" build, i.e. the one that shows the reports whose
        # train number starts with 9. The Chinese and TX variants live on the
        # lbjradio branch; this branch builds nothing else.
        include:
          - { hide9: 'OFF', suffix: '9' }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile Fusion${{ matrix.suffix }}
      run: |
        chmod +x compile-with-docker.sh
        ./compile-with-docker.sh Fusion -DENABLE_LBJ_HIDE9=${{ matrix.hide9 }}

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-artifact${{ matrix.suffix }}
        path: build/Fusion/f4hwn.fusion.bin
