name: Build Firmware

on:
  push:
    branches: [ main00, main ]
    paths:
      - 'App/**'
      - '!App/apps/**'
      - 'Core/**'
      - 'Drivers/**'
      - 'Middlewares/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'Dockerfile'
      - 'compile-with-docker.sh'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

concurrency:
  group: build-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The archive step below pushes to the main00 branch, so the default
    # read-only GITHUB_TOKEN would not be enough.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Four LBJRadio builds. Every one hides the reports whose train number
        # starts with 9 (there is no "show all" build any more).
        #
        #   tx:      ENABLE_LBJ_TX_LOCK - forces F Lock=CN and TXLock on and
        #            pins both menu items (TX only on 409-410 / 144-148 /
        #            430-440 MHz). OFF is the same radio with TX left to the
        #            operator.
        #   cn:      ENABLE_CN_FONT - the Chinese build: the characters the
        #            firmware uses are compiled into the image (no external
        #            font to flash) and the LBJ popup is in Chinese.
        #   archive: the name the .bin is committed under in the main00
        #            branch's archive/ folder. Only the TX locked builds are
        #            archived; the two TX variants stay CI artifacts.
        include:
          - { name: LBJRADIO,    tx: 'ON',  cn: 'OFF', bin: 'lbjradio.bin',    archive: 'LBJRADIO'    }
          - { name: LBJRADIOtx,  tx: 'OFF', cn: 'OFF', bin: 'lbjradio.bin',    archive: ''            }
          - { name: LBJRADIOcn,  tx: 'ON',  cn: 'ON',  bin: 'lbjradio.bin',    archive: 'LBJRADIO-cn' }
          - { name: LBJRADIOcntx,tx: 'OFF', cn: 'ON',  bin: 'lbjradio.bin',    archive: ''            }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile ${{ matrix.name }}
      run: |
        chmod +x compile-with-docker.sh
        ./compile-with-docker.sh LBJRadio \
          -DENABLE_LBJ_HIDE9=ON \
          -DENABLE_LBJ_TX_LOCK=${{ matrix.tx }} \
          -DENABLE_CN_FONT=${{ matrix.cn }}

    # Where the preset writes the image is CMake's business; pick the file out
    # of the tree instead of hard-coding the build directory.
    - name: Locate the image
      id: image
      run: |
        set -euo pipefail
        bin=$(find build -name '${{ matrix.bin }}' -type f | head -1)
        echo "::warning::built ${bin:-<none>}"
        find build -name '*.bin' -type f -exec ls -l {} \; | while read -r l; do echo "::warning::$l"; done
        test -n "$bin"
        echo "path=$bin" >> "$GITHUB_OUTPUT"

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.name }}
        path: ${{ steps.image.outputs.path }}

    # The archive lives on main00. Only the two TX locked builds feed it (no
    # "archive" name on the others). A run on main00 archives too: the bot only
    # commits under archive/, and the paths filter above does not match it, so
    # that commit does not start another run.
    - name: Checkout main00 for the archive
      if: matrix.archive != ''
      uses: actions/checkout@v4
      with:
        ref: main00
        path: archive-repo
        fetch-depth: 0

    - name: Archive firmware to main00
      if: matrix.archive != ''
      run: |
        set -euo pipefail
        version=$(python3 -c "import json;ps=json.load(open('CMakePresets.json'))['configurePresets'];print(next(p['cacheVariables']['VERSION_STRING_2'] for p in ps if p['name']=='default'))")
        mkdir -p archive-repo/archive
        cp "${{ steps.image.outputs.path }}" "archive-repo/archive/${{ matrix.archive }}.${version}.bin"
        cd archive-repo
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add archive
        if git diff --cached --quiet; then
          echo "archive already up to date"
        else
          git commit -m "Archive ${{ matrix.archive }} ${version} firmware"
          # The two archived builds run side by side; if the other one pushed
          # first, rebase onto it and try again.
          ok=0
          for attempt in 1 2 3; do
            if git push; then ok=1; break; fi
            git pull --rebase --autostash origin main00
          done
          test "$ok" = 1
        fi
