name: Build Firmware

on:
  push:
    branches: [ main00, main ]
    paths:
      - 'App/**'
      - '!App/apps/**'
      - 'Core/**'
      - 'Drivers/**'
      - 'Middlewares/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'Dockerfile'
      - 'compile-with-docker.sh'
      - 'tools/ci-build.sh'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

concurrency:
  group: build-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # main00 carries the single "show 9" firmware. The Chinese and TX-lock
        # variants live on the lbjradio branch; this branch never builds them.
        include:
          - { name: LBJRADIO9, hide9: 'OFF' }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile ${{ matrix.name }}
      run: |
        chmod +x compile-with-docker.sh
        ./compile-with-docker.sh LBJRadio \
          -DENABLE_LBJ_HIDE9=${{ matrix.hide9 }}

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.name }}
        path: build/LBJRadio/lbjradio.bin
