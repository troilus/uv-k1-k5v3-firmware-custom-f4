name: Build Firmware

on:
  push:
    branches: [ main00, main, lbjradio ]
    paths:
      - 'App/**'
      - '!App/apps/**'
      - 'Core/**'
      - 'Drivers/**'
      - 'Middlewares/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'Dockerfile'
      - 'compile-with-docker.sh'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

concurrency:
  group: build-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two artifacts per preset: the plain name hides the reports whose
        # train number starts with 9, the "9" suffixed one shows everything.
        include:
          - { preset: Fusion,   hide9: 'ON',  suffix: ''  }
          - { preset: Fusion,   hide9: 'OFF', suffix: '9' }
          - { preset: LBJRadio, hide9: 'ON',  suffix: ''  }
          - { preset: LBJRadio, hide9: 'OFF', suffix: '9' }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile ${{ matrix.preset }}${{ matrix.suffix }}
      run: |
        chmod +x compile-with-docker.sh
        ./compile-with-docker.sh ${{ matrix.preset }} -DENABLE_LBJ_HIDE9=${{ matrix.hide9 }}

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.preset }}${{ matrix.suffix }}
        path: build/${{ matrix.preset }}/*.bin
