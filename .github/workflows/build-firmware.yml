name: Build Firmware

on:
  push:
    branches: [ main00, main, lbjradio ]
    paths:
      - 'App/**'
      - '!App/apps/**'
      - 'Core/**'
      - 'Drivers/**'
      - 'Middlewares/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'Dockerfile'
      - 'compile-with-docker.sh'
      - 'tools/ci-build.sh'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

concurrency:
  group: build-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The archive step below pushes to the main00 branch, so the default
    # read-only GITHUB_TOKEN would not be enough.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Four LBJRadio builds, all hiding reports whose train number starts
        # with 9 (there is no "show 9" build on this branch).
        #
        #   preset:  LBJRadio = TX locked (F Lock pinned to CN, TXLock forced
        #            on); LBJRadioTX = same radio with TX left to the operator.
        #   cn:      ENABLE_CN_FONT - the Chinese build: the characters the
        #            firmware uses are compiled into the image (no external
        #            font to flash) and the LBJ popup is in Chinese.
        #   archive: the name the .bin is committed under in main00's archive/
        #            folder. Only the two TX-locked builds are archived - TX is
        #            not allowed on this radio, so those are the ones people
        #            download. The two TX-unlocked builds stay CI artifacts.
        include:
          - { preset: LBJRadio,   hide9: 'ON', cn: 'OFF', suffix: '',    bin: 'lbjradio.bin',    archive: 'LBJRADIO'    }
          - { preset: LBJRadio,   hide9: 'ON', cn: 'ON',  suffix: '-cn', bin: 'lbjradio.bin',    archive: 'LBJRADIO-cn' }
          - { preset: LBJRadioTX, hide9: 'ON', cn: 'OFF', suffix: '',    bin: 'lbjradio.tx.bin', archive: ''            }
          - { preset: LBJRadioTX, hide9: 'ON', cn: 'ON',  suffix: '-cn', bin: 'lbjradio.tx.bin', archive: ''            }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile ${{ matrix.preset }}${{ matrix.suffix }}
      run: |
        chmod +x compile-with-docker.sh
        ./compile-with-docker.sh ${{ matrix.preset }} \
          -DENABLE_LBJ_HIDE9=${{ matrix.hide9 }} \
          -DENABLE_CN_FONT=${{ matrix.cn }}

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.preset }}${{ matrix.suffix }}
        path: build/${{ matrix.preset }}/*.bin

    # The archive lives on main00. Only the two TX-locked builds feed it
    # (the TX-unlocked builds have no "archive" name). A run on main00 never
    # archives its own build.
    - name: Checkout main00 for the archive
      if: matrix.archive != '' && github.ref_name != 'main00'
      uses: actions/checkout@v4
      with:
        ref: main00
        path: archive-repo
        fetch-depth: 0

    - name: Archive firmware to main00
      if: matrix.archive != '' && github.ref_name != 'main00'
      run: |
        set -euo pipefail
        # The version comes from the preset that was built, not from "default":
        # LBJRadio/LBJRadioTX override VERSION_STRING_2, so reading "default"
        # used to file a v5.5.5 image under v5.5.4.
        version=$(python3 - "${{ matrix.preset }}" <<'PY'
        import json, sys
        presets = {p['name']: p for p in json.load(open('CMakePresets.json'))['configurePresets']}
        def value(name, key):
            p = presets[name]
            if key in p.get('cacheVariables', {}):
                return p['cacheVariables'][key]
            return value(p['inherits'], key) if 'inherits' in p else None
        print(value(sys.argv[1], 'VERSION_STRING_2'))
        PY
        )
        mkdir -p archive-repo/archive
        cp "build/${{ matrix.preset }}/${{ matrix.bin }}" "archive-repo/archive/${{ matrix.archive }}.${version}.bin"
        cd archive-repo
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add archive
        if git diff --cached --quiet; then
          echo "archive already up to date"
        else
          git commit -m "Archive ${{ matrix.archive }} ${version} firmware"
          # The two archived builds run side by side; if the other one pushed
          # first, rebase onto it and try again.
          ok=0
          for attempt in 1 2 3; do
            if git push; then ok=1; break; fi
            git pull --rebase --autostash origin main00
          done
          test "$ok" = 1
        fi
