name: Build Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Compile firmware
      run: |
        chmod +x compile-with-docker.sh
        ./compile-with-docker.sh Fusion

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-artifact
        path: build/Fusion/f4hwn.fusion.bin

    - name: Compile overlay apps
      run: |
        chmod +x compile-app.sh
        ./compile-app.sh All

    - name: Upload overlay apps artifact
      uses: actions/upload-artifact@v4
      with:
        name: overlay-apps
        path: build/Apps/*.app