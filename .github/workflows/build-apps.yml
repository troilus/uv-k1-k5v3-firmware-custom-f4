name: Build Apps

on:
  push:
    branches: [ main00, main ]
    paths:
      - 'App/apps/**'
      - 'compile-app.sh'
      - 'Dockerfile'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two artifacts per build flavour: the plain name hides the reports
        # whose train number starts with 9, a "9" in the suffix shows
        # everything. The overlay budget is tight, so one variant overflowing
        # still lets the others build (fail-fast is off).
        #
        # The English build is the default: "LINE " plus the pinyin initials of
        # the route, the model abbreviation only, no key 5 and no coordinates
        # row - the coordinates row does not fit in it. The Chinese build
        # (LBJ_ROUTE_CN) keeps the GB2312 route, the key-5 language toggle and
        # the footer hint, and it does have the room for the coordinates row
        # (LBJ_COORDS), so that flavour is offered too.
        include:
          # LBJ_PIN_FREQ pins the receiver to 821.2375 MHz when the app opens
          # (the loader restores the user's VFO on exit). Only the two plain
          # flavours carry it: the "9" variants and the coordinate variants
          # keep their overlay budget untouched.
          - { hide9: '1', suffix: '',                pin: '1' }
          - { hide9: '',  suffix: '9',                            }
          - { hide9: '1', suffix: '-cn',        cn: '1', pin: '1' }
          - { hide9: '',  suffix: '-cn9',       cn: '1'           }
          - { hide9: '1', suffix: '-cn-coord',  cn: '1', coords: '1' }
          - { hide9: '',  suffix: '-cn9-coord', cn: '1', coords: '1' }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile overlay apps${{ matrix.suffix }}
      env:
        LBJ_HIDE9:    ${{ matrix.hide9 }}
        LBJ_ROUTE_CN: ${{ matrix.cn }}
        LBJ_COORDS:   ${{ matrix.coords }}
        LBJ_PIN_FREQ: ${{ matrix.pin }}
      run: |
        chmod +x compile-app.sh
        ./compile-app.sh All

    - name: Upload overlay apps artifact
      uses: actions/upload-artifact@v4
      with:
        name: overlay-apps${{ matrix.suffix }}
        path: build/Apps/*.app
        if-no-files-found: error
