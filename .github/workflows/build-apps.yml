name: Build Apps

on:
  push:
    branches: [ main00, main ]
    paths:
      - 'App/apps/**'
      - 'compile-app.sh'
      - 'Dockerfile'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile overlay apps
      run: |
        chmod +x compile-app.sh
        ./compile-app.sh All

    - name: Upload overlay apps artifact
      uses: actions/upload-artifact@v4
      with:
        name: overlay-apps
        path: build/Apps/*.app
        if-no-files-found: error
