name: Build Apps

on:
  push:
    branches: [ main00, main ]
    paths:
      - 'App/apps/**'
      - 'compile-app.sh'
      - 'Dockerfile'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One artifact per language: both hide the reports whose train number
        # starts with 9 and pin the receiver to the LBJ channel.  The
        # coordinates row (LBJ_COORDS) and the "show everything" variants are
        # no longer built - the overlay budget is tight and one flavour
        # overflowing still lets the other build (fail-fast is off).
        #
        # The English build is the default: "LINE " plus the pinyin initials of
        # the route, the model abbreviation only, no key 5 and no coordinates
        # row.  The Chinese build (LBJ_ROUTE_CN) keeps the GB2312 route and the
        # key-5 language toggle.
        include:
          # LBJ_PIN_FREQ pins the receiver to 821.2375 MHz when the app opens
          # (the loader restores the user's VFO on exit).
          - { hide9: '1', suffix: '',    pin: '1' }
          - { hide9: '1', suffix: '-cn', cn: '1', pin: '1' }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile overlay apps${{ matrix.suffix }}
      env:
        LBJ_HIDE9:    ${{ matrix.hide9 }}
        LBJ_ROUTE_CN: ${{ matrix.cn }}
        LBJ_COORDS:   ${{ matrix.coords }}
        LBJ_PIN_FREQ: ${{ matrix.pin }}
      run: |
        chmod +x compile-app.sh
        ./compile-app.sh All

    - name: Upload overlay apps artifact
      uses: actions/upload-artifact@v4
      with:
        name: overlay-apps${{ matrix.suffix }}
        path: build/Apps/*.app
        if-no-files-found: error
